<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 590" role="img" aria-labelledby="title desc">
  <title id="title">revoq MergingCursor time-ordered merge</title>
  <desc id="desc">A MergingCursor joins several independent streams and presents their committed frames as one sequence ordered by gen_time, earliest first. Each source stream has its own single Appender.</desc>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#14b8a6"/>
    </marker>
    <style>
      text { font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
      .title { font-size: 27px; font-weight: 800; }
      .label { font-size: 19px; font-weight: 700; }
      .clabel{ font-size: 17px; font-weight: 700; }
      .body  { font-size: 16px; }
      .small { font-size: 13.5px; }
      .tiny  { font-size: 12px; }
      .mono  { font-family: "SFMono-Regular", ui-monospace, Menlo, Consolas, monospace; font-size: 14px; font-weight: 700; }

      .bg      { fill: #ffffff; }
      .ink     { fill: #0f172a; }
      .sub     { fill: #64748b; }
      .accent  { fill: #0d9488; }
      .panel   { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1.5; }
      .stream  { fill: #f0fdfa; stroke: #0d9488; stroke-width: 2; }
      .cell    { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.25; }
      .arrow   { stroke: #14b8a6; stroke-width: 2.5; fill: none; marker-end: url(#ar); }

      @media (prefers-color-scheme: dark) {
        .bg     { fill: #0b1220; }
        .ink    { fill: #e2e8f0; }
        .sub    { fill: #94a3b8; }
        .accent { fill: #2dd4bf; }
        .panel  { fill: #111a2e; stroke: #334155; }
        .stream { fill: #0c2b29; stroke: #2dd4bf; }
        .cell   { fill: #0e1a30; stroke: #475569; }
      }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="1040" height="590" rx="18"/>
  <text class="ink title" x="40" y="52">MergingCursor &#8212; one time-ordered view</text>
  <text class="sub body" x="40" y="82">join() many streams; read committed frames in gen_time order</text>

  <!-- Stream A -->
  <rect class="panel" x="40" y="130" width="360" height="92" rx="12"/>
  <text class="ink label" x="60" y="162">Stream A</text>
  <rect class="cell" x="176" y="146" width="66" height="60" rx="8"/>
  <text class="ink mono" x="192" y="182">t=10</text>
  <rect class="cell" x="250" y="146" width="66" height="60" rx="8"/>
  <text class="ink mono" x="266" y="182">t=40</text>
  <rect class="cell" x="324" y="146" width="66" height="60" rx="8"/>
  <text class="ink mono" x="340" y="182">t=90</text>

  <!-- Stream B -->
  <rect class="panel" x="40" y="238" width="360" height="92" rx="12"/>
  <text class="ink label" x="60" y="270">Stream B</text>
  <rect class="cell" x="176" y="254" width="66" height="60" rx="8"/>
  <text class="ink mono" x="192" y="290">t=20</text>
  <rect class="cell" x="250" y="254" width="66" height="60" rx="8"/>
  <text class="ink mono" x="266" y="290">t=30</text>
  <rect class="cell" x="324" y="254" width="66" height="60" rx="8"/>
  <text class="ink mono" x="340" y="290">t=70</text>

  <!-- Stream C -->
  <rect class="panel" x="40" y="346" width="360" height="92" rx="12"/>
  <text class="ink label" x="60" y="378">Stream C</text>
  <rect class="cell" x="176" y="362" width="66" height="60" rx="8"/>
  <text class="ink mono" x="192" y="398">t=15</text>
  <rect class="cell" x="250" y="362" width="66" height="60" rx="8"/>
  <text class="ink mono" x="266" y="398">t=55</text>
  <rect class="cell" x="324" y="362" width="66" height="60" rx="8"/>
  <text class="ink mono" x="340" y="398">t=80</text>

  <text class="sub small" x="40" y="470">each stream has one Appender &#183; frames carry gen_time</text>

  <!-- join arrows -->
  <path class="arrow" d="M 402 176 C 430 176 436 232 450 232"/>
  <path class="arrow" d="M 402 284 C 430 284 436 276 450 276"/>
  <path class="arrow" d="M 402 392 C 430 392 436 320 450 320"/>

  <!-- MergingCursor -->
  <rect class="stream" x="452" y="196" width="150" height="160" rx="14"/>
  <text class="ink clabel" x="527" y="252" text-anchor="middle">MergingCursor</text>
  <text class="sub small" x="527" y="278" text-anchor="middle">merge by gen_time</text>
  <text class="sub small" x="527" y="298" text-anchor="middle">earliest first</text>

  <path class="arrow" d="M 604 276 C 636 276 648 276 686 276"/>

  <!-- Merged ordered view -->
  <rect class="panel" x="688" y="118" width="312" height="382" rx="14"/>
  <text class="ink label" x="712" y="150">One ordered view</text>
  <text class="sub small" x="712" y="172">by gen_time &#183; earliest first</text>

  <rect class="cell" x="712" y="186" width="264" height="28" rx="6"/>
  <text class="ink mono" x="726" y="205">t=10</text>
  <text class="sub small" x="964" y="205" text-anchor="end">Stream A</text>

  <rect class="cell" x="712" y="220" width="264" height="28" rx="6"/>
  <text class="ink mono" x="726" y="239">t=15</text>
  <text class="sub small" x="964" y="239" text-anchor="end">Stream C</text>

  <rect class="cell" x="712" y="254" width="264" height="28" rx="6"/>
  <text class="ink mono" x="726" y="273">t=20</text>
  <text class="sub small" x="964" y="273" text-anchor="end">Stream B</text>

  <rect class="cell" x="712" y="288" width="264" height="28" rx="6"/>
  <text class="ink mono" x="726" y="307">t=30</text>
  <text class="sub small" x="964" y="307" text-anchor="end">Stream B</text>

  <rect class="cell" x="712" y="322" width="264" height="28" rx="6"/>
  <text class="ink mono" x="726" y="341">t=40</text>
  <text class="sub small" x="964" y="341" text-anchor="end">Stream A</text>

  <rect class="cell" x="712" y="356" width="264" height="28" rx="6"/>
  <text class="ink mono" x="726" y="375">t=55</text>
  <text class="sub small" x="964" y="375" text-anchor="end">Stream C</text>

  <rect class="cell" x="712" y="390" width="264" height="28" rx="6"/>
  <text class="ink mono" x="726" y="409">t=70</text>
  <text class="sub small" x="964" y="409" text-anchor="end">Stream B</text>

  <rect class="cell" x="712" y="424" width="264" height="28" rx="6"/>
  <text class="ink mono" x="726" y="443">t=80</text>
  <text class="sub small" x="964" y="443" text-anchor="end">Stream C</text>

  <rect class="cell" x="712" y="458" width="264" height="28" rx="6"/>
  <text class="ink mono" x="726" y="477">t=90</text>
  <text class="sub small" x="964" y="477" text-anchor="end">Stream A</text>

  <!-- footer -->
  <rect class="foot panel" x="40" y="512" width="960" height="52" rx="12"/>
  <text class="ink body" x="64" y="544">The cursor merges without blocking any appender. One appender per stream; many cursors per stream.</text>
</svg>
