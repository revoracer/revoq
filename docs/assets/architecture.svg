<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 582" role="img" aria-labelledby="title desc">
  <title id="title">revoq same-host IPC stream</title>
  <desc id="desc">One Appender writes frames into a memory-mapped stream made of segment files; many independent MergingCursors read committed frames from the same stream at their own positions, all on one host.</desc>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#14b8a6"/>
    </marker>
    <style>
      text { font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
      .title { font-size: 27px; font-weight: 800; }
      .label { font-size: 19px; font-weight: 700; }
      .body  { font-size: 16px; }
      .small { font-size: 13.5px; }
      .tiny  { font-size: 12px; }

      .bg      { fill: #ffffff; }
      .ink     { fill: #0f172a; }
      .sub     { fill: #64748b; }
      .panel   { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1.5; }
      .stream  { fill: #f0fdfa; stroke: #0d9488; stroke-width: 2; }
      .cell    { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.25; }
      .len     { fill: #f59e0b; stroke: #d97706; stroke-width: 1; }
      .foot    { fill: #f1f5f9; stroke: #e2e8f0; stroke-width: 1.5; }
      .arrow   { stroke: #14b8a6; stroke-width: 2.5; fill: none; marker-end: url(#ar); }

      @media (prefers-color-scheme: dark) {
        .bg     { fill: #0b1220; }
        .ink    { fill: #e2e8f0; }
        .sub    { fill: #94a3b8; }
        .panel  { fill: #111a2e; stroke: #334155; }
        .stream { fill: #0c2b29; stroke: #2dd4bf; }
        .cell   { fill: #0e1a30; stroke: #475569; }
        .len    { fill: #f59e0b; stroke: #fbbf24; }
        .foot   { fill: #0e1728; stroke: #1e293b; }
      }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="1040" height="582" rx="18"/>
  <text class="ink title" x="40" y="52">revoq &#8212; same-host IPC stream</text>
  <text class="sub body" x="40" y="82">one Appender writes; many cursors read independently, on one host</text>

  <!-- Appender -->
  <rect class="panel" x="40" y="180" width="190" height="140" rx="12"/>
  <text class="ink label" x="64" y="226">Appender</text>
  <text class="sub small" x="64" y="254">single writer</text>
  <text class="sub small" x="64" y="274">per stream</text>
  <text class="sub tiny" x="240" y="242">append</text>
  <path class="arrow" d="M 232 250 C 256 250 270 250 296 250"/>

  <!-- Stream -->
  <rect class="stream" x="300" y="140" width="440" height="300" rx="14"/>
  <text class="ink label" x="326" y="180">Memory-mapped stream</text>
  <text class="sub small" x="326" y="204">segment files &#183; same host</text>

  <!-- segment (earlier) -->
  <rect class="panel" x="326" y="236" width="190" height="150" rx="10"/>
  <text class="sub small" x="338" y="262">segment</text>
  <rect class="cell" x="338" y="284" width="52" height="78" rx="6"/>
  <rect class="cell" x="396" y="284" width="52" height="78" rx="6"/>
  <rect class="cell" x="454" y="284" width="52" height="78" rx="6"/>
  <text class="sub tiny" x="352" y="378">frame</text>

  <!-- segment (current) -->
  <rect class="panel" x="524" y="236" width="190" height="150" rx="10"/>
  <text class="sub small" x="536" y="262">segment &#183; current</text>
  <rect class="cell" x="536" y="284" width="52" height="78" rx="6"/>
  <rect class="cell" x="594" y="284" width="52" height="78" rx="6"/>
  <rect class="cell" x="652" y="284" width="52" height="78" rx="6"/>
  <rect class="len"  x="694" y="284" width="10" height="78" rx="3"/>
  <text class="sub tiny" x="704" y="378" text-anchor="end">length</text>

  <text class="sub small" x="326" y="422">frames append left &#8594; right &#183; length is published last</text>

  <!-- fan-out to cursors -->
  <path class="arrow" d="M 742 193 C 762 193 772 193 788 193"/>
  <path class="arrow" d="M 742 295 C 762 295 772 295 788 295"/>
  <path class="arrow" d="M 742 397 C 762 397 772 397 788 397"/>

  <!-- Cursors -->
  <rect class="panel" x="792" y="150" width="208" height="86" rx="12"/>
  <text class="ink label" x="814" y="186">MergingCursor</text>
  <text class="sub small" x="814" y="212">reads at frame N</text>

  <rect class="panel" x="792" y="252" width="208" height="86" rx="12"/>
  <text class="ink label" x="814" y="288">MergingCursor</text>
  <text class="sub small" x="814" y="314">reads at frame N&#8722;8</text>

  <rect class="panel" x="792" y="354" width="208" height="86" rx="12"/>
  <text class="ink label" x="814" y="390">MergingCursor</text>
  <text class="sub small" x="814" y="416">reads at frame N&#8722;42</text>

  <text class="sub small" x="792" y="462">same stream &#183; independent read positions</text>

  <!-- footer -->
  <rect class="foot" x="40" y="500" width="960" height="52" rx="12"/>
  <text class="ink body" x="64" y="532">Same host only. A slow, restarted, or crashed reader never stalls the Appender.</text>
</svg>
