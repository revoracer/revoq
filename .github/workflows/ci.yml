name: CI

# Correctness only. These run on shared, virtualized GitHub-hosted runners,
# which are fine for "does it build and do the tests pass" but are NOT a
# latency environment. Performance numbers come from the tuned benchmark on an
# isolated host (see docs/benchmarking.md), never from CI.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cpp:
    name: C++ build + tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Clang 20
        run: |
          wget https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 20

      - name: Tool versions
        run: CXX=/usr/bin/clang++-20 ./build.sh doctor

      - name: Build and run C++ tests
        run: |
          sudo prlimit --memlock=unlimited:unlimited --pid $$
          CXX=/usr/bin/clang++-20 ./build.sh test

      # Compile-only: catches benchmark/HdrHistogram build breakage that the
      # test build never touches. CI never *runs* the benchmark for numbers —
      # those come from a tuned isolated host (see docs/benchmarking.md).
      - name: Build benchmark targets (compile only)
        run: CXX=/usr/bin/clang++-20 ./build.sh benchmarks

  python:
    name: Python bindings + tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Clang 20
        run: |
          wget https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 20

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pytest
        run: python3 -m pip install --upgrade pip pytest

      - name: Build bindings and run Python tests
        run: CXX=/usr/bin/clang++-20 PYTHON=python3 ./build.sh python

  # Schema + edition + chartability check for committed comparative artifacts.
  # Pure-Python, no JVM and no load generator — validates the JSON already
  # committed under results/, never runs the Aeron/Chronicle drivers (see
  # comparative/README.md).
  #
  # This is NOT a full publish gate: it does not enforce the workload.md publish
  # minimum (>= 5M messages/point) or reject dirty (uncommitted-source) versions,
  # so exploratory runs (e.g. the 1M comprehensive sweep) intentionally pass.
  # Publish-worthiness is asserted by a run's own README, not by this job.
  comparative-results:
    name: Validate comparative result JSON (schema/OSS)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate every committed results dir (schema + --require-oss)
        run: |
          validator=benchmarks/comparative/harness/validate_results.py
          shopt -s nullglob
          found=0
          for dir in benchmarks/comparative/results/*/; do
            [ -f "$dir/env.json" ] || continue   # skip provenance-less scratch dirs
            found=1
            echo "== validating $dir =="
            python3 "$validator" --require-oss "$dir"
          done
          if [ "$found" = 0 ]; then
            echo "No committed results dir with env.json yet — nothing to validate."
          fi
